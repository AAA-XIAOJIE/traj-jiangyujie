[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traj-course"
version = "0.1.0"
description = "Reproducible ETH/UCY pedestrian trajectory coursework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
traj-course = "traj_course.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
